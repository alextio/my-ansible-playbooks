[defaults]
# Points to your file so they don't have to use -i
inventory = inventory.ini

# Automatically look for the password file (if they created it)
vault_password_file = .vault_pass

# Disables the "Are you sure you want to connect?" prompt
host_key_checking = False

# Keeps the output pretty and readable (community.general.yaml removed in v12)
stdout_callback = ansible.builtin.default
result_format = yaml

[ssh_connection]
# Ensures Ansible uses their local ~/.ssh/config for ports/keys
ssh_args = -o ControlMaster=auto -o ControlPersist=60s