---
- name: Localhost - VSCode Setup
  hosts: "{{ target_hosts | default('localhost') }}"
  connection: local
  gather_facts: true
  tasks:
    - name: Deploy VSCode settings
      ansible.builtin.copy:
        src: templates/settings.json
        dest: "{{ ansible_facts['env']['HOME'] }}/Library/Application Support/Code/User/settings.json"
        mode: "0644"
        backup: true

    - name: Deploy VSCode keybindings
      ansible.builtin.copy:
        src: templates/keybindings.json
        dest: "{{ ansible_facts['env']['HOME'] }}/Library/Application Support/Code/User/keybindings.json"
        mode: "0644"
        backup: true
