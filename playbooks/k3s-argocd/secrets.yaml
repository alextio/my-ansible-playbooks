---
- name: Create cluster Secrets from vault
  hosts: "{{ target_hosts | default('k3s_server') }}"
  gather_facts: false
  become: true
  vars_files:
    - vars.yml
  vars:
    k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
    # Variables named <namespace>__<secret-name> (see
    # group_vars/k3s_server/CLAUDE.md). Uses the varnames lookup because the
    # internal `vars` dict is deprecated (removed in ansible-core 2.24)
    vault_secret_names: >-
      {{ lookup('ansible.builtin.varnames', '^[a-z0-9.-]+__[a-z0-9.-]+$', wantlist=True) | sort }}
    # In check mode on a fresh host the cluster and Python client don't
    # exist yet, so only talk to the cluster if both are already there
    secrets_can_apply: >-
      {{ not ansible_check_mode or (
           secrets_kubeconfig_stat.stat.exists and
           secrets_k8s_client.rc == 0) }}
  tasks:
    - name: Check for k3s kubeconfig
      ansible.builtin.stat:
        path: "{{ k3s_kubeconfig }}"
      register: secrets_kubeconfig_stat

    - name: Check for Python Kubernetes client
      ansible.builtin.command: python3 -c "import kubernetes"
      register: secrets_k8s_client
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Create Secret namespaces
      when: secrets_can_apply | bool
      kubernetes.core.k8s:
        kubeconfig: "{{ k3s_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item.split('__')[0] }}"
      loop: "{{ vault_secret_names | map('split', '__') | map('first') | unique }}"
      loop_control:
        label: "{{ item }}"

    - name: Create cluster Secrets from vault
      when: secrets_can_apply | bool
      no_log: true
      kubernetes.core.k8s:
        kubeconfig: "{{ k3s_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.split('__')[1] }}"
            namespace: "{{ item.split('__')[0] }}"
          type: Opaque
          # Dict keys aren't templated, so build the whole mapping in Jinja
          stringData: "{{ {k3s_secret_data_key: lookup('ansible.builtin.vars', item)} }}"
      loop: "{{ vault_secret_names }}"
      loop_control:
        label: "{{ item.split('__')[0] }}/{{ item.split('__')[1] }}"
