---
- name: Ubuntu - Rootless Docker with NVIDIA GPU Setup
  hosts: "{{ target_hosts | default('all:!proxy') }}"
  gather_facts: true
  vars_files:
    - vars.yml
  tasks:
    - name: Check if rootless Docker is installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/bin/dockerd-rootless.sh"
      register: dockerd_rootless_stat

    - name: Ensure Docker user config directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/docker"
        state: directory
        mode: "0755"

    - name: Configure NVIDIA container runtime for rootless Docker
      ansible.builtin.command: >
        nvidia-ctk runtime configure
        --runtime=docker
        --config={{ nvidia_ctk_daemon_config }}
      changed_when: true

    - name: Ensure user systemd directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: Deploy docker user systemd unit file
      ansible.builtin.template:
        src: "templates/docker.service.j2"
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/docker.service"
        mode: "0644"
        backup: true
      notify: Reload user systemd daemon

    - name: Enable and start docker user systemd service
      ansible.builtin.systemd:
        name: docker.service
        enabled: true
        state: started
        scope: user

  handlers:
    - name: Reload user systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
