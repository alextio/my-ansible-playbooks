---
- name: Localhost - Generate SSH keypair
  hosts: "{{ target_hosts | default('localhost') }}"
  gather_facts: true
  vars_files:
    - vars.yml
  tasks:
    - name: Create local SSH directory
      ansible.builtin.file:
        path: ~/.ssh
        state: directory
        mode: "0700"

    - name: Generate SSH keypair
      community.crypto.openssh_keypair:
        path: "{{ ssh_key_path }}"
        type: "{{ ssh_key_type }}"
        comment: "{{ ssh_key_comment }}"
        state: present
      register: keypair

- name: Remote hosts - Authorize SSH public key
  hosts: "{{ target_hosts | default('REMOTE_SERVERS') }}"
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Ensure ~/.ssh directory exists
      ansible.builtin.file:
        path: ~/.ssh
        state: directory
        mode: "0700"

    - name: Add public key to authorized_keys
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ hostvars['localhost']['keypair']['public_key'] }}"
        state: present
