---
- name: UTH - Claude Setup
  hosts: "{{ target_hosts | default('all:!proxy') }}"
  gather_facts: true
  tasks:
    - name: Ensure ~/.claude directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.claude"
        state: directory
        mode: "0755"

    - name: Deploy global CLAUDE.md
      ansible.builtin.template:
        src: templates/CLAUDE.md.j2
        dest: "{{ ansible_facts['env']['HOME'] }}/.claude/CLAUDE.md"
        mode: "0644"
        backup: true

    - name: Check if claude is installed
      ansible.builtin.command: which claude
      register: claude_which
      changed_when: false
      failed_when: false

    - name: Get installed claude version
      ansible.builtin.shell: claude --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
      register: claude_current
      changed_when: false
      failed_when: false
      when: claude_which.rc == 0

    - name: Get latest claude version from npm
      ansible.builtin.shell: npm view @anthropic-ai/claude-code version 2>/dev/null
      register: claude_latest
      changed_when: false
      failed_when: false

    - name: Install or update claude code
      ansible.builtin.shell:
        cmd: curl -fsSL https://claude.ai/install.sh | bash
      when: >-
        claude_which.rc != 0 or
        (claude_latest.rc == 0 and
         claude_latest.stdout | trim != '' and
         (claude_current.stdout | default('')) | trim != claude_latest.stdout | trim)
