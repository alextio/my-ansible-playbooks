---
# Installs the T3 Code CLI (`t3`) with the official install script:
# https://github.com/pingdotgg/t3code/blob/main/docs/user/install.md
# The script unpacks the release into ~/.t3/runtime/versions/<version> and links
# `t3` into ~/.local/bin. It never edits shell rc files. Then it runs the role
# for each provider in t3_providers (defaults/main.yml); logging in to them is
# manual, on the same host.
- name: Get installed t3 version
  ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/t3 --version"
  register: t3_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install t3 to ~/.local/bin
  ansible.builtin.shell:
    cmd: curl -fsSL https://t3.codes/install.sh | T3CODE_VERSION={{ t3_version }} sh
  when: t3_check.rc != 0 or (t3_check.stdout | regex_search('[0-9][^ ]*')) != t3_version
  changed_when: true

- name: Set up provider CLIs
  ansible.builtin.include_role:
    name: "{{ t3_provider }}"
  loop: "{{ t3_providers }}"
  loop_control:
    loop_var: t3_provider
