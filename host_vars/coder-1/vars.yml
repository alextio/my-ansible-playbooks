---
# Agent workspace VM (rootless Podman, LAN-isolated by the Proxmox firewall).

# roles/t3code: run the t3 server as a service.
t3_service: true
# LAN mode: the server listens on coder-1's LAN address, port 3773, so the
# phone reaches it at home and over Tailscale (through the subnet router).
# The Proxmox firewall doesn't filter incoming traffic, so anyone on the LAN
# can reach the port; a pairing token is the only lock, and a paired device
# gets a shell as `user` (who has sudo). Each run prints a pairing code.
t3_service_env:
  T3CODE_LAN: "true"
# pi first: it pulls in the nodejs role, which the npm Claude Code needs.
t3_providers:
  - pi
  - claude_code

# roles/claude_code: Claude Code's native binary needs a newer CPU than the
# Proxmox host's Athlon II (it dies with SIGILL). 2.1.112 is the last release
# that's plain JavaScript, so it's pinned from npm, without auto-updates and
# without seven months of fixes. Remove this on new hardware.
claude_code_npm_version: "2.1.112"
